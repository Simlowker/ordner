# mlx_lm.lora config for the distilled coordinator, paths relative to ~/ordner/track_2b (see train.sh)
model: ../models/apertus-v1.5-8b-text
train: true
fine_tune_type: lora
data: work/distill/lora_data
mask_prompt: true  # required by distill/train.py: loss on the assistant reply only
num_layers: -1
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.0
batch_size: 1
grad_accumulation_steps: 4
iters: 2000  # train.sh sets 2 epochs (2 x train.jsonl lines); a later --iters wins
learning_rate: 1.0e-4  # as finetune/lora_config.yaml
optimizer: adam
grad_checkpoint: true
max_seq_length: 8192  # = prepare.py --max-tokens (longer turns are dropped there, never truncated here)
steps_per_report: 10
steps_per_eval: 200
val_batches: -1
save_every: 200
adapter_path: work/adapters/coordinator-distill-v1
seed: 7
